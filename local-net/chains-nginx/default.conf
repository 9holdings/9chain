# nginx cho trang "Danh bạ L1" (9chain-a1-chains).
#
# Vì sao cần file này thay vì mount lồng nhau: thư mục trang được mount :ro, mà
# Docker phải TẠO điểm gắn cho mount con -> ghi vào rootfs chỉ-đọc và fail. Nên
# state của console được mount ra một đường dẫn riêng rồi ánh xạ lại bằng alias.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Bản sao CHỈ ĐỌC state của console: tên chain, subnetID, blockchainID,
    # chainId, thời điểm tạo — đều là thông tin công khai, không có bí mật.
    # Chỉ mở đúng MỘT file, không bật autoindex, để không lộ những file khác
    # nằm cùng thư mục config (genesis mẫu, console-tmp/...).
    location = /data/console-chains.json {
        alias /srv/a1-config/console-chains.json;
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    # Status of the disclosed synthetic load test (heartbeat-pump.mjs). Public on
    # purpose: it lists the nine sending addresses so anyone can subtract the
    # generated traffic from the real numbers. Hiding this file would turn an
    # honest test into metric inflation.
    #
    # no-store because it is rewritten every 5 seconds. A cached copy would show a
    # pulse that stopped long ago, which is the same "false green" this project has
    # already paid for more than once.
    location = /data/heartbeat.json {
        alias /srv/a1-config/heartbeat.json;
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
